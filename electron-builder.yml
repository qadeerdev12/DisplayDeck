appId: com.qadeer.displaydeck
productName: DisplayDeck
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
  # Menu bar only: no Dock icon, no app switcher entry.
  extendInfo:
    LSUIElement: true
  identity: null
